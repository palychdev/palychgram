<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>PalychGram</h1>
<label>Тема <select id="theme">
<option value="midnight">Midnight</option>
<option value="amoled">AMOLED</option>
<option value="snow">Snow</option>
<option value="forest">Forest</option>
<option value="grape">Grape</option>
<option value="sunset">Sunset</option>
</select></label>
<div class="swatches" id="swatches"></div>
<label><input type="checkbox" id="blurPrivacy"> Blur-privacy <small>(Alt+Shift+B)</small></label>
<label><input type="checkbox" id="wideChat"> Широкий чат</label>
<label><input type="checkbox" id="hideSponsored"> Скрыть рекламу</label>
<label><input type="checkbox" id="hideStories"> Скрыть сторис-сайдбар</label>
<label><input type="checkbox" id="confirmBeforeStory"> Подтверждение перед сторис</label>
<label><input type="checkbox" id="forceSnow"> Снег ❄</label>
<p class="hint">Полные настройки — в Options.</p>
<script src="popup.js"></script>
</body>
</html>
