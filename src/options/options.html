<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>PalychGram — настройки</title>
<style>body{font:14px system-ui;max-width:640px;margin:24px;background:#0e1116;color:#e8eaf0}label{display:block;margin:8px 0}.warn{color:#ffb454}button{margin-top:8px}textarea{width:100%;height:80px}</style>
</head>
<body>
<h1>PalychGram — настройки</h1>
<h2>Внешний вид</h2>
<label>Акцент <input type="color" id="accent" value="#7aa2ff"></label>
<label>Плотность <select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option><option value="cozy">Cozy</option></select></label>
<label>Стиль папок <select id="folderStyle"><option value="pills">Pills</option><option value="chips">Chips</option></select></label>
<label>Скругление аватарок <input type="range" id="avatarRadius" min="0" max="50" value="50"> <span id="avatarRadiusVal">50%</span></label>
<label>Размер шрифта <input type="range" id="fontScale" min="85" max="125" value="100"> <span id="fontScaleVal">100%</span></label>
<label>Размер стикеров <input type="range" id="stickerScale" min="70" max="150" value="100"> <span id="stickerScaleVal">100%</span></label>
<label><input type="checkbox" id="wideChat"> Широкий чат</label>
<label><input type="checkbox" id="forceSnow"> Снег ❄</label>
<h2>Контент</h2>
<label><input type="checkbox" id="hideSponsored"> Скрывать рекламу</label>
<label><input type="checkbox" id="hideSimilarChannels"> Скрыть «похожие каналы»</label>
<label><input type="checkbox" id="hideStories"> Скрыть сторис-сайдбар</label>
<label><input type="checkbox" id="confirmBeforeStory"> Подтверждение перед открытием сторис</label>
<label><input type="checkbox" id="secondsInTime"> Время с секундами</label>
<label><input type="checkbox" id="unroundCounters"> Не округлять счётчики (12.3K → 12345)</label>
<label><input type="checkbox" id="showPeerId"> Бейдж ID чата в профиле</label>
<label><input type="checkbox" id="noCopyRestrict"> Снимать запрет копирования (DOM)</label>
<label><input type="checkbox" id="autoPause"> Пауза медиа при сворачивании вкладки</label>
<label><input type="checkbox" id="blurPrivacy"> Blur-privacy (хоткей Alt+Shift+B)</label>
<h2>Эксперименты</h2>
<p class="warn">Могут сломаться при обновлении Telegram Web. Полного невидимого online при переписке не существует — сервер ставит online на любой write.</p>
<label><input type="checkbox" id="expTypingOff"> Не отправлять «печатает…» (эксперимент)</label>
<label><input type="checkbox" id="expLocalPremiumLook"> Локальный премиум-визуал (только себе)</label>
<h2>Backup</h2>
<p><button id="exportBtn">Экспорт настроек</button> <button id="importBtn">Импорт</button></p>
<textarea id="backupBox" placeholder="JSON настроек"></textarea>
<script src="options.js"></script>
</body>
</html>
