<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>PalychGram — настройки</title>
<link rel="stylesheet" href="options.css"></head>
<body>
<div class="wrap">
<h1>PalychGram</h1>

<div class="card">
<h2>вид</h2>
<label>акцент <input type="color" id="accent" value="#7aa2ff"></label>
<label>плотность <select id="density"><option value="comfortable">обычная</option><option value="compact">компакт</option><option value="cozy">свободно</option></select></label>
<label>папки <select id="folderStyle"><option value="pills">пилюли</option><option value="chips">чипсы</option></select></label>
<label>аватарки <input type="range" id="avatarRadius" min="0" max="50" value="50"><span class="val" id="avatarRadiusVal">50%</span></label>
<label>шрифт <input type="range" id="fontScale" min="85" max="125" value="100"><span class="val" id="fontScaleVal">100%</span></label>
<label>стикеры: размер <input type="range" id="stickerScale" min="70" max="150" value="100"><span class="val" id="stickerScaleVal">100%</span></label>
<label>стикеры: скругление <input type="range" id="stickerRadius" min="0" max="32" value="12"><span class="val" id="stickerRadiusVal">12</span></label>
<label>шрифт сообщений <select id="msgFont"><option value="system">системный</option><option value="serif">с засечками</option><option value="mono">моно</option></select></label>
<label>широкий чат <input type="checkbox" id="wideChat"></label>
<label>снег <input type="checkbox" id="forceSnow"></label>
</div>

<div class="card">
<h2>чистка</h2>
<label>без рекламы <input type="checkbox" id="hideSponsored"></label>
<label>без похожих каналов <input type="checkbox" id="hideSimilarChannels"></label>
<label>без сторис <input type="checkbox" id="hideStories"></label>
<label>спрашивать перед сторис <input type="checkbox" id="confirmBeforeStory"></label>
<label>время с секундами <input type="checkbox" id="secondsInTime"></label>
<label>счётчики без округления <input type="checkbox" id="unroundCounters"></label>
<label>бейдж id чата <input type="checkbox" id="showPeerId"></label>
<label>снимать запрет копирования <input type="checkbox" id="noCopyRestrict"></label>
<label>пауза медиа при сворачивании <input type="checkbox" id="autoPause"></label>
</div>

<div class="card">
<h2>скорость</h2>
<label>выключить анимации <input type="checkbox" id="noAnim"></label>
<label>убрать блюр интерфейса <input type="checkbox" id="noBlur"></label>
<label>копировать текст по даблклику <input type="checkbox" id="dblCopy"></label>
</div>

<div class="card">
<h2>приватность</h2>
<label>блюр <input type="checkbox" id="blurPrivacy"></label>
<label>блюрить и текст сообщений <input type="checkbox" id="blurText"></label>
<label>скрывать номера телефонов <input type="checkbox" id="hidePhones"></label>
</div>

<div class="card">
<h2>эксперименты</h2>
<p class="warn">может сломаться при обновлении вебки. невидимости при переписке не существует — сервер палит онлайн на любой отправке.</p>
<label>не слать "печатает" <input type="checkbox" id="expTypingOff"></label>
<label>премиум-визуал (только себе) <input type="checkbox" id="expLocalPremiumLook"></label>
</div>

<div class="card">
<h2>шаблоны ответов</h2>
<div id="snipList"></div>
<div class="rowbtns"><input id="snipInput" placeholder="новый шаблон" style="flex:1;background:#0e1116;color:#e8eaf0;border:1px solid #2b3140;border-radius:8px;padding:7px"><button id="snipAdd">+</button></div>
</div>

<div class="card">
<h2>заметки</h2>
<textarea id="notes" placeholder="сохраняется само"></textarea>
</div>

<div class="card">
<h2>своё</h2>
<label>css <textarea id="customCss" placeholder=".bubble { ... }"></textarea></label>
</div>

<div class="card">
<h2>бекап</h2>
<div class="rowbtns"><button id="exportBtn">экспорт</button><button id="importBtn">импорт</button></div>
<textarea id="backupBox" placeholder="json настроек"></textarea>
</div>

</div>
<script src="options.js"></script>
</body>
</html>
